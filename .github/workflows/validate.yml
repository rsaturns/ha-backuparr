name: Validate

# What Home Assistant and its catalog check: hassfest (manifest, translations,
# brand images) and the HACS action (repository, hacs.json, README images,
# integration categories). Both must pass without ignored checks for the
# catalog. Nightly too, since both checks change upstream.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names are required status checks on main - keep them stable.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # home-assistant/actions has no release with hassfest; it runs the
      # latest ghcr.io/home-assistant/hassfest image either way.
      - name: hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false
