version: 2
# One weekly PR per ecosystem. pip covers the test harness, which pins the
# Home Assistant release the tests run against.
#
# A new version waits 7 days before Dependabot proposes it, so a hijacked
# release is usually caught and pulled before it reaches us. GitHub's
# security updates don't wait.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
